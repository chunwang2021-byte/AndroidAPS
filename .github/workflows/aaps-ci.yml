name: AAPS CI
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Release APK
        env:
          ORG_GRADLE_PROJECT_storeFile: ./keystore/demokeystore.jks
          ORG_GRADLE_PROJECT_storePassword: ${{ secrets.STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleFullRelease

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: AAPS.apk
          path: app/build/outputs/apk/full/release/app-full-release.apk
